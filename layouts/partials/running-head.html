{{/* A small header on inner pages: site title linking home, then the `nav` menu (minus its "home" entry). */}}
<nav class="running-head" aria-label="Site">
  <a class="running-head-home" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <ul>
    {{ range site.Menus.nav }}
    {{ if ne .Identifier "home" }}
    <li><a href="{{ .URL | relURL }}"{{ if eq (strings.TrimSuffix "/" .URL) (strings.TrimSuffix "/" $.RelPermalink) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
    {{ end }}
    {{ end }}
  </ul>
</nav>
